<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nahom Aklil | Papa Smurf</title>
    <meta
      name="description"
      content="Nahom Aklil aka Papa Smurf — Game Developer &amp; Frontend Developer. Personal website coming soon."
    />
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Theme Toggle -->
    <button
      id="theme-toggle"
      aria-label="Toggle dark/light mode"
      title="Toggle theme"
    >
      <span class="toggle-icon" id="toggle-icon">
        <i class="fas fa-moon"></i>
      </span>
    </button>

    <!-- Main Content -->
    <main class="container" id="main-content">
      <!-- Profile Section -->
      <section class="profile-section" aria-label="Profile">
        <div class="profile-row">
          <div class="avatar-wrapper">
            <img
              src="logo.png"
              alt="Nahom Aklil aka Papa Smurf logo"
              class="avatar"
              id="profile-avatar"
            />
          </div>
          <div class="profile-info">
            <h1 class="profile-name">
              Nahom Aklil <span class="name-divider">|</span>
              <span class="alias">Papa Smurf</span>
            </h1>
            <p class="profile-role">Game Developer &amp; Frontend Developer</p>
          </div>
        </div>
      </section>

      <!-- Greeting Section -->
      <section class="greeting-section" aria-label="Introduction">
        <p class="greeting-text">
          Hello, I'm <span class="highlight-name">Nahom</span>.
        </p>
        <p class="bio-text">
          This is my corner of the internet. where I
          <span class="highlight-word">build</span> games, craft interfaces, and
          live in my own little <span class="highlight-word">realm</span>.
        </p>
      </section>

      <!-- Under Construction -->
      <section class="construction-section" aria-label="Site status">
        <div class="construction-line">
          <span class="construction-icon" aria-hidden="true">
            <i class="fas fa-tools"></i>
          </span>
          <span class="construction-text">
            The website is under construction. will be on
            <span class="highlight-soon">soon</span>
          </span>
        </div>

        <!-- Contact Links -->
        <div class="contact-links" aria-label="Contact links">
          <a
            href="tel:+251950185287"
            id="link-phone"
            class="contact-link"
            aria-label="Phone number"
          >
            <span class="contact-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2.77h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.09a16 16 0 0 0 6 6l.91-1.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.46 16.92z"
                />
              </svg>
            </span>
            <span class="contact-label">+251 95 018 5287</span>
          </a>
          <a
            href="https://www.linkedin.com/in/nahom-aklil-fisseha-128237368?utm_source=share_via&utm_content=profile&utm_medium=member_android"
            id="link-linkedin"
            class="contact-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn profile"
          >
            <span class="contact-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                />
                <rect x="2" y="9" width="4" height="12" />
                <circle cx="4" cy="4" r="2" />
              </svg>
            </span>
            <span class="contact-label">LinkedIn</span>
          </a>
          <a
            href="https://www.instagram.com/nahom.akf24?stkn=MXVzZHI2dGN3Zjd4cg=="
            id="link-instagram"
            class="contact-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram profile"
          >
            <span class="contact-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
              </svg>
            </span>
            <span class="contact-label">Instagram</span>
          </a>
          <a
            href="https://t.me/nahom_akf"
            id="link-telegram"
            class="contact-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram profile"
          >
            <span class="contact-icon">
              <i class="fab fa-telegram"></i>
            </span>
            <span class="contact-label">Telegram</span>
          </a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </body>
</html>
